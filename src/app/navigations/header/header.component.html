<nav
  class="font-sans flex flex-row md:bg-red-100 text-left justify-between py-2 px-6 bg-gradient-to-r from-white to-indigo-100 shadow items-center md:items-baseline w-full z-10">
  <button (click)="openSidebar()" class="md:hidden group z-10">
    <svg class="md:hidden  w-8 h-8 duration-300 transform" fill="none" stroke="currentColor" stroke-linecap="round"
      stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22 11c0-4.97-4.477-9-10-9S2 6.03 2 11h20Z" clip-rule="evenodd"></path>
      <path d="M22 19H2v3h20v-3Z"></path>
      <path d="m2 14 2.727 2 3.637-2L12 16l3.636-2 3.637 2L22 14"></path>
    </svg>
  </button>
  <div class="md:mb-0 mx-auto md:mx-0 md:flex md:flex-row">
    <div>
      <a routerLink="dashboard">
        <img class="w-auto h-9 md:h-12 select-none" [src]="'assets/images/aino.webp'" alt="AINO" loading="eager"
          priority>
      </a>
    </div>
  </div>

  <div class="md:mb-0 flex items-center md:space-x-4 " *ngIf="!is_guest">
    <span *ngIf="role_code != 'SA'" class="relative hidden md:block">
      <a routerLinkActive="bottom-nav-active" routerLink="/notification">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"
          stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M20.047 16.473c-1.204-1.473-2.053-2.223-2.053-6.285 0-3.72-1.9-5.044-3.463-5.688a.835.835 0 0 1-.466-.495C13.79 3.072 13.022 2.25 12 2.25s-1.791.823-2.063 1.756a.827.827 0 0 1-.466.494c-1.565.645-3.463 1.965-3.463 5.688-.002 4.062-.852 4.812-2.056 6.285-.499.61-.062 1.527.81 1.527h14.48c.867 0 1.301-.92.805-1.527Z">
          </path>
          <path d="M15 18v.75a3 3 0 0 1-6 0V18"></path>
        </svg>
        <div *ngIf="!allSigned"
          class="pulse absolute inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-blue-500 rounded-full -top-2 -end-2 dark:border-gray-900">
        </div>
        <div *ngIf="!allSigned"
          class="absolute inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-blue-500 border-2 border-white rounded-full -top-2 -end-2 dark:border-gray-900">
        </div>
      </a>
    </span>
    <!-- <span class="hidden md:block">
      <a routerLinkActive="bottom-nav-active" routerLink="/first-component">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"
          stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M19.875 4.5H4.125c-1.036 0-1.875.84-1.875 1.875v11.25c0 1.035.84 1.875 1.875 1.875h15.75c1.035 0 1.875-.84 1.875-1.875V6.375c0-1.036-.84-1.875-1.875-1.875Z">
          </path>
          <path d="M5.25 7.5 12 12.75l6.75-5.25"></path>
        </svg>
      </a> 
    </span> -->
    <span class="hidden md:block">
      <a routerLinkActive="bottom-nav-active" routerLink="/help">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"
          stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"></path>
          <path fill="currentColor" stroke="none" d="M12 18a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path>
          <path d="M12 12.75a2.625 2.625 0 1 0-2.625-2.625"></path>
        </svg>
      </a>
    </span>
    <span class="text-sm hidden md:block">
      <div>{{ day }}</div>
      <div>{{ date }}</div>
    </span>

    <span class="md:border-l-[.5px] md:border-black md:pl-3 flex items-center space-x-3">
      <p class="hidden md:block font-medium">{{ user_name }}</p>
      <button id="bjirrr" (click)="toggleProfileDropdown()"
        class="text-white font-medium rounded-lg text-sm text-center inline-flex items-center" type="button">
        <img alt="Foto Profil" src="https://i.pinimg.com/474x/18/e2/49/18e249f0a674fc4ef63e3b28fd938de2.jpg"
          class="relative inline-block h-10 w-10 cursor-pointer rounded-full object-cover object-center select-none" />
      </button>

      <div *ngIf="isProfileDropdownOpen"
        class=" absolute top-16 md:top-20 right-0 z-10 bg-white divide-y divide-gray-100 rounded-lg shadow w-40 dark:bg-gray-700 border group-hover:block">
        <ul class="py-2 text-sm text-gray-700 dark:text-gray-200" aria-labelledby="dropdownHoverButton">
          <li>
            <a routerLink="user/profile" class="block px-4 py-2 hover:bg-gray-100 ">Profile</a>
          </li>
          <!-- <li class="block md:hidden">
            <a routerLink="first-component" class="block px-4 py-2 hover:bg-gray-100 ">Mail</a>
          </li> -->
          <li class="block md:hidden">
            <a routerLink="/notification" class="block px-4 py-2 hover:bg-gray-100 ">Notification</a>
          </li>
          <li>
            <a routerLink="/user/change-password" class="block px-4 py-2 hover:bg-gray-100 ">Change
              Password</a>
          </li>
          <li class="w-full">
            <button type="button" (click)="onLogout()"
              class="w-full block px-4 py-2 text-red-500 hover:bg-gray-100 text-left ">Sign
              out</button>
          </li>
        </ul>
      </div>

    </span>
  </div>
</nav>
<!-- <marquee class="z-1 text-sky-700">#Marquee</marquee> -->

<div class="block md:hidden w-full">
  <section id="bottom-navigation"
    class="block fixed inset-x-0 bottom-0 z-[5] bg-[#fcfaff] shadow  border border-gray-400">
    <div id="tabs" class="flex justify-between">
      <a routerLinkActive="bottom-nav-active" routerLink="/dashboard"
        class="w-full focus:text-teal-500 hover:text-teal-500 justify-center inline-block text-center pt-2 pb-1">
        <svg width="25" height="25" class="inline-block mb-1" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M14.25 19.499v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75v4.5a.75.75 0 0 1-.75.75H4.5a.75.75 0 0 1-.75-.75v-8.672a.778.778 0 0 1 .244-.553l7.5-6.816a.75.75 0 0 1 1.012 0l7.5 6.816a.777.777 0 0 1 .244.553V19.5a.75.75 0 0 1-.75.75H15a.75.75 0 0 1-.75-.75Z">
          </path>
        </svg>
        <span class="tab tab-home block text-xs">Home</span>
      </a>
      <a href="/dashboard#pricing"
        class="w-full focus:text-teal-500 hover:text-teal-500 justify-center inline-block text-center pt-2 pb-1">
        <svg width="25" height="25" class="inline-block mb-1" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M2 6h20v4l-.7.42a3.5 3.5 0 0 1-3.6 0L17 10l-.7.42a3.5 3.5 0 0 1-3.6 0L12 10l-.7.42a3.5 3.5 0 0 1-3.6 0L7 10l-.7.42a3.5 3.5 0 0 1-3.6 0L2 10V6Z">
          </path>
          <path d="M4 11.244V22h16V11"></path>
          <path d="M4 5.911V2h16v4"></path>
          <path d="M14.5 16h-5v6h5v-6Z"></path>
        </svg>
        <span class="tab tab-kategori block text-xs">Shop</span>
      </a>
      <button
        class="relative inline-flex flex-col items-center text-xs font-medium text-white py-3 px-6 flex-grow group">
        <div
          class="absolute bottom-5 p-3 rounded-full border-4 border-white bg-blue-600 group-hover:rotate-45 transition-transform duration-300">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
            stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="m12.03 5-.018 14"></path>
            <path d="M5 12h14"></path>
          </svg>
        </div>
        <span class="sr-only">Add</span>
        <div
          class="absolute top-[-9rem] w-[50vw] text-black opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-500 ease-in-out">
          <div class="relative flex justify-center items-center space-x-8">
            <!-- 1 Empty Circle -->
            <div class="w-16 h-16 "></div>

            <!-- 2 (DA) -->
            <a routerLink="/form/da"
              class="w-16 h-16 aspect-square flex items-center justify-center border-2 border-gray-600 rounded-full bg-gray-100 hover:bg-gray-200">
              <p class="text-sm font-medium">DA</p>
            </a>

            <!-- 3 Empty Circle -->
            <div class="w-16 h-16 "></div>
          </div>

          <div class="flex justify-center items-center space-x-8 mt-1">
            <!-- 4 (ITCM) -->
            <a routerLink="/form/itcm"
              class="w-16 h-16 aspect-square flex items-center justify-center border-2 border-gray-600 rounded-full bg-gray-100 hover:bg-gray-200">
              <p class="text-sm font-medium">ITCM</p>
            </a>

            <!-- 5 Empty Circle -->
            <div class="w-16 h-16 "></div>

            <!-- 6 (BA) -->
            <a routerLink="/form/ba"
              class="w-16 h-16 aspect-square flex items-center justify-center border-2 border-gray-600 rounded-full bg-gray-100 hover:bg-gray-200">
              <p class="text-sm font-medium">BA</p>
            </a>
          </div>
        </div>
      </button>

      <a routerLinkActive="bottom-nav-active" routerLink="/notification"
        class=" w-full focus:text-teal-500 hover:text-teal-500 justify-center inline-block text-center pt-2 pb-1">
        <div class="relative w-fit mx-auto">
          <svg width="25" height="25" class="inline-block mb-1" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M20.047 16.473c-1.204-1.473-2.053-2.223-2.053-6.285 0-3.72-1.9-5.044-3.463-5.688a.835.835 0 0 1-.466-.495C13.79 3.072 13.022 2.25 12 2.25s-1.791.823-2.063 1.756a.827.827 0 0 1-.466.494c-1.565.645-3.463 1.965-3.463 5.688-.002 4.062-.852 4.812-2.056 6.285-.499.61-.062 1.527.81 1.527h14.48c.867 0 1.301-.92.805-1.527Z">
            </path>
            <path d="M15 18v.75a3 3 0 0 1-6 0V18"></path>
          </svg>
          <div *ngIf="!allSigned"
            class="absolute inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-blue-500 border-2 border-white rounded-full -top-2 -end-2 dark:border-gray-900">
          </div>
        </div>
        <span class="tab tab-whishlist block text-xs">Notification</span>
      </a>
      <a routerLinkActive="bottom-nav-active" routerLink="/user/profile"
        class="w-full focus:text-teal-500 hover:text-teal-500 justify-center inline-block text-center pt-2 pb-1">
        <svg width="25" height="25" class="inline-block mb-1" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
          <path
            d="M3 20.4v.6h18v-.6c0-2.24 0-3.36-.436-4.216a4 4 0 0 0-1.748-1.748C17.96 14 16.84 14 14.6 14H9.4c-2.24 0-3.36 0-4.216.436a4 4 0 0 0-1.748 1.748C3 17.04 3 18.16 3 20.4Z">
          </path>
        </svg>
        <span class="tab tab-account block text-xs">Account</span>
      </a>
    </div>
  </section>
</div>
